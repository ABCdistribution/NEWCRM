<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nouveau CRM ABC — démo de l'appli mobile</title>
<style>
:root{
  --violet:#6545C5; --violet-fonce:#4B2FA0; --bleu:#1D4ED8; --fond:#F1F3FB; --carte:#fff; --texte:#111827; --muted:#6B7280;
  --ok:#059669; --warn:#D97706; --alert:#DC2626; --ligne:#E5E7EF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Inter,Segoe UI,Roboto,system-ui,sans-serif;background:#1c1b29;color:var(--texte);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 12px 32px}
.cote{display:flex;flex-direction:column;gap:10px;align-items:stretch;width:170px;padding-top:34px;flex:none;color:#cfcbea;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.cote .groupe{display:flex;align-items:center;gap:8px;margin-top:6px}
.cote .groupe:before{content:"";width:8px;height:8px;border-radius:50%;background:#8c72e6}
.cote .groupe:first-child{margin-top:0}
.cote .groupe.bleu{color:#9ED2FE}.cote .groupe.bleu:before{background:#65B8FD}
.cote .groupe.violet{color:#CDBBFD}.cote .groupe.violet:before{background:#B396FB}
.cote button[data-role=promoteur]{border-color:#2f5f9a;background:#1b2d4a}
.cote button[data-role=promoteur].actif{background:linear-gradient(135deg,#65B8FD,#1F7AEA);border-color:#65B8FD;color:#fff}
.cote button[data-role=cs],.cote button[data-role=dir]{border-color:#5a4a8c}
.cote button[data-role=cs].actif,.cote button[data-role=dir].actif{background:linear-gradient(135deg,#B396FB,#7A56E6);border-color:#B396FB}
.cote button{background:#2d2b44;color:#e9e7ff;border:1px solid #46436b;border-radius:12px;padding:11px 12px;font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;cursor:pointer;text-align:left}
.cote button.actif{background:#6545C5;border-color:#8c72e6;color:#fff}
.demo-barre{padding:0 150px;width:100%;max-width:980px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;color:#d8d6ee;font-size:13px;margin-bottom:14px}
.demo-barre b{color:#fff}
.demo-barre button{background:#2d2b44;color:#e9e7ff;border:1px solid #46436b;border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer}
.demo-barre button.actif{background:#6545C5;border-color:#8c72e6;color:#fff}
.scene{display:flex;gap:28px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.aide{max-width:300px;color:#cfcbea;font-size:13px;line-height:1.5}
.aide h3{color:#fff;margin:0 0 8px;font-size:15px}
.aide li{margin-bottom:6px}
.tel{zoom:.95;width:390px;height:780px;background:#000;border-radius:44px;padding:10px;box-shadow:0 20px 60px #0008;position:relative;flex:none}
.ecran{width:100%;height:100%;background:var(--fond);border-radius:34px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.statut{height:26px;background:var(--violet);color:#fff;font-size:12px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;flex:none}
.statut.sales{background:var(--bleu)}
.pagewrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.page{flex:1;min-height:0;overflow-y:auto;position:relative}
.page::-webkit-scrollbar{width:0}
.nav{flex:none;height:68px;background:#fff;display:flex;border-top:1px solid var(--ligne)}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted);cursor:pointer}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--violet);font-weight:700}
.nav.sales button.on{color:var(--bleu)}
.entete{background:var(--violet);color:#fff;padding:14px 16px 16px;border-radius:0 0 28px 28px}
.entete.sales{background:var(--bleu)}
.entete h1{margin:0;font-size:23px;font-weight:800}
.entete .sous{font-size:12.5px;color:#ffffffb8;margin-top:2px}
.bonjour{display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:#ffffff33;border:1px solid #ffffff88;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.bonjour .t{flex:1;min-width:0}
.bonjour .t b{display:block;font-size:19px}
.cloche{width:42px;height:42px;border-radius:14px;background:#ffffff26;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.cloche i{position:absolute;top:5px;right:5px;background:#F59E0B;color:#111;border-radius:9px;font-size:10px;font-style:normal;font-weight:800;padding:0 5px}
.switch{display:flex;background:#ffffff26;border-radius:16px;padding:4px;margin-top:12px}
.switch button{flex:1;border:0;border-radius:12px;height:38px;background:none;color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.switch button.on{background:#fff;color:var(--violet);font-weight:800}
.switch.sales button.on{color:var(--bleu)}
.tuiles{display:flex;gap:8px;margin-top:14px}
.tuile{flex:1;background:#ffffff26;border-radius:16px;padding:10px 12px;color:#fff;border:0;text-align:left;font-family:inherit;cursor:default}
.tuile small{display:block;font-size:11.5px;color:#ffffffc4}
.tuile b{font-size:22px;font-weight:800}
.tuile.c{text-align:center;cursor:pointer}
.tuile.c.on{background:#fff;color:var(--violet)}
.tuile.c.on small{color:var(--violet)}
.corps{padding:16px 16px 24px}
.titre-ligne{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.titre-ligne h2{margin:0;font-size:19px;font-weight:800}
.lien{color:var(--violet);font-weight:700;font-size:13.5px;cursor:pointer;background:none;border:0;padding:0}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:16px;padding:13px 14px;margin-bottom:10px;cursor:pointer}
.carte.statique{cursor:default}
.carte h4{margin:0;font-size:14.5px;font-weight:800}
.carte p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.prochain{border:1.6px solid var(--violet);padding:14px}
.ligne{display:flex;gap:10px;align-items:flex-start}
.rond{width:36px;height:36px;border-radius:50%;background:#EDEFF3;display:flex;align-items:center;justify-content:center;flex:none;color:var(--muted)}
.prochain .rond{background:#6545C51f;color:var(--violet)}
.rond.fait{background:#CDEFD9;color:var(--ok)}
.pastille{display:inline-block;border-radius:8px;padding:3px 9px;font-size:11.5px;font-weight:800;white-space:nowrap}
.p-gris{background:#EDEFF3;color:#374151}.p-violet{background:#6545C51f;color:var(--violet)}.p-jaune{background:#FCEFC6;color:#92400E}.p-bleu{background:#DFE8FF;color:#1E3A8A}.p-vert{background:#DDF5E6;color:#166534}.p-rouge{background:#FEE2E2;color:#991B1B}.p-client{background:#EBE5FF;color:#5B21B6}
.btn{border:1px solid #9ca3af;background:#fff;color:var(--violet);border-radius:999px;height:44px;font-weight:700;font-size:14px;cursor:pointer;width:100%;font-family:inherit}
.btn.plein{background:var(--violet);border-color:var(--violet);color:#fff}
.btn.tonal{background:#E7E0F7;border-color:#E7E0F7;color:var(--violet-fonce)}
.btn.sm{height:38px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.rangee{display:flex;gap:10px}
.rangee>*{flex:1}
.fab{position:absolute;right:16px;bottom:14px;background:var(--violet);color:#fff;border:0;border-radius:20px;padding:15px 20px;font-weight:800;font-size:14.5px;box-shadow:0 8px 20px #6545C566;cursor:pointer;display:flex;gap:8px;align-items:center;z-index:5;font-family:inherit}
.fab.rond{width:58px;height:58px;padding:0;border-radius:20px;justify-content:center;font-size:30px;font-weight:400;line-height:1}
.bas{flex:none;display:flex;gap:10px;padding:10px 16px 12px;background:var(--fond);border-top:1px solid var(--ligne)}
.recherche{width:100%;border:1px solid var(--ligne);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:12px;background:#fff;font-family:inherit}
.seg{display:flex;border:1px solid #9ca3af;border-radius:999px;overflow:hidden;margin-bottom:14px;background:#fff}
.seg button{flex:1;border:0;background:none;height:42px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--texte);font-family:inherit}
.seg button.on{background:#E7E0F7;color:var(--violet-fonce);font-weight:800}
.retour{width:42px;height:42px;border-radius:14px;background:#ffffff2e;display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;color:#fff}
.actions{display:flex;gap:8px;margin-top:16px}
.actions.six{flex-wrap:wrap}.actions.six button{flex:1 1 calc(33.3% - 8px);min-width:0}
.actions button{flex:1;background:#ffffff2e;border:0;border-radius:16px;padding:11px 0 9px;color:#fff;font-weight:700;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-family:inherit}
.actions svg{width:22px;height:22px}
.badge{background:#FCEFC6;color:#92400E;border-radius:10px;padding:6px 12px;font-weight:800;font-size:12.5px}
.kpi{display:flex;gap:8px;margin-bottom:12px}
.kpi div{flex:1;background:#fff;border:1px solid var(--ligne);border-radius:14px;padding:10px 11px}
.kpi small{color:var(--muted);font-size:11px;display:block}
.kpi b{font-size:18px;display:block;margin-top:2px}
.kpi i{font-style:normal;font-size:11px;color:var(--warn);font-weight:700}
.onglets{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.onglets button{border:0;background:#E7E8F1;border-radius:999px;padding:9px 16px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--texte);font-family:inherit}
.onglets button.on{background:#111827;color:#fff}
.etape-barre{display:flex;gap:4px;margin:12px 0}
.etape-barre div{flex:1}
.etape-barre span{display:block;height:5px;border-radius:3px;background:var(--ligne)}
.etape-barre div.on span{background:var(--violet)}
.etape-barre em{display:block;font-style:normal;font-size:10px;margin-top:6px;color:var(--muted);white-space:nowrap}
.etape-barre div.cur em{color:var(--violet);font-weight:800}
.tl{background:#fff;border:1px solid var(--ligne);border-radius:16px;padding:14px 14px 4px}
.tl-ev{display:flex;gap:10px;position:relative;padding-bottom:14px}
.tl-ev:not(:last-child):before{content:"";position:absolute;left:15px;top:34px;bottom:2px;width:2px;background:var(--ligne)}
.tl-ic{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
.tl-ev b{font-size:14px}
.tl-ev small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.tl-ev .d{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap;padding-left:8px}
.jours{display:flex;gap:6px;margin-top:14px}
.jour{flex:1;background:#ffffff26;border-radius:16px;padding:9px 0;text-align:center;color:#ffffffbf;cursor:pointer;border:0;font-family:inherit}
.jour small{display:block;font-size:12px;font-weight:600}
.jour b{display:block;font-size:19px;color:#fff;margin:1px 0}
.jour em{display:block;font-style:normal;font-size:10.5px;font-weight:700}
.jour.on{background:#fff}.jour.on b{color:#111827}.jour.on small,.jour.on em{color:var(--violet)}
.semaine{display:flex;align-items:center;gap:8px;margin-top:12px}
.semaine h1{flex:1;margin:0;font-size:21px}
.rond-b{width:38px;height:38px;border-radius:13px;background:#ffffff2e;border:0;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.bandeau{background:#fff;border:1px solid var(--ligne);border-radius:16px;padding:14px;margin-bottom:14px}
.bandeau b{font-size:14.5px;display:flex;gap:8px;align-items:center}
.bandeau p{margin:5px 0 0;font-size:12.5px;color:var(--muted)}
.heure-l{display:flex;gap:6px;margin-bottom:12px}
.heure-l .h{width:46px;padding-top:12px;font-weight:800;font-size:15px;flex:none}
.etape-c{flex:1;border-radius:14px;padding:12px 14px;cursor:pointer}
.etape-c .t{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.etape-c .t b{font-size:14.5px}
.etape-c small{display:block;margin-top:4px;font-size:12.5px;opacity:.85}
.crayon{background:none;border:0;cursor:pointer;color:inherit;padding:0 0 0 6px;font-size:15px}
.rap-carte{background:#FEF9E7;border:1px solid #F3E3A1;border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;margin-bottom:22px}
.rap-ic{width:44px;height:44px;border-radius:12px;background:#FCE9A8;display:flex;align-items:center;justify-content:center;color:#B45309;flex:none}
.rap-l b{font-size:15px}
.rap-l small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.rap-h{display:flex;justify-content:space-between;align-items:flex-start}
.chiffres{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px}
.chiffres b{font-weight:800}.chiffres span{color:var(--muted)}
.pied{margin-top:8px;font-size:11.5px;color:var(--muted)}
.voile{position:absolute;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end}
.feuille{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:10px 16px 20px;max-height:92%;overflow-y:auto}
.feuille .poignee{width:36px;height:4px;background:#d1d5db;border-radius:2px;margin:0 auto 12px}
.feuille h3{margin:0 0 10px;font-size:17px}
.feuille .ch{padding:14px 4px;border-bottom:1px solid var(--ligne);display:flex;justify-content:space-between;cursor:pointer;font-size:15px}
.dialogue{align-self:center;margin:0 22px;background:#fff;border-radius:22px;padding:20px;width:100%}
.dialogue h3{margin:0 0 8px}
.dialogue p{margin:0 0 14px;font-size:14px;color:#374151;line-height:1.45}
.champ{margin-bottom:12px}
.champ label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.champ input,.champ textarea,.champ select{width:100%;border:1px solid #c7cad6;border-radius:12px;padding:11px 12px;font-size:14px;font-family:inherit;background:#fff}
.champ textarea{min-height:72px;resize:vertical}
.cases{display:flex;flex-wrap:wrap;gap:8px 16px;margin-bottom:12px;font-size:14px}
.cases label{display:flex;gap:6px;align-items:center}
.erreur{background:#FEE2E2;color:#991B1B;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:#1f2937;color:#fff;border-radius:12px;padding:12px 14px;font-size:13.5px;z-index:30;box-shadow:0 6px 18px #0006}
.vide{text-align:center;color:var(--muted);padding:24px;background:#fff;border:1px solid var(--ligne);border-radius:16px}
.sales-home .carte{cursor:default}
.btn.plein.sales{background:var(--bleu);border-color:var(--bleu)}
.btn.sales-fond{background:#DFE8FF;border-color:#DFE8FF;color:#1E3A8A}
.seg.sales button.on{background:#DFE8FF;color:#1E3A8A}
.onglets button.on.sales,.chip.on.sales{background:var(--bleu);color:#fff;border-color:var(--bleu)}
.chip{border:1px solid #c7cad6;background:#fff;border-radius:999px;padding:8px 14px;font-size:13.5px;cursor:pointer;color:var(--texte);font-family:inherit}
.racs{display:flex;justify-content:space-between;gap:8px}
.rac{flex:1;background:#fff;border:1px solid var(--ligne);border-radius:16px;padding:12px 0 10px;font-size:12px;font-weight:600;color:var(--texte);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-family:inherit}
.rac span{font-size:22px}
.chip-date{background:#E5E7EB;color:var(--muted);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600}
.actions button.plein{background:#fff;color:var(--bleu);font-size:14px;font-weight:800;justify-content:center}
.v-tete{background:#fff;padding:12px 16px;border-bottom:1px solid var(--ligne)}
.barre{height:6px;background:#E3E8F3;border-radius:4px;overflow:hidden}.barre span{display:block;height:100%;background:var(--bleu)}
.ve{padding:14px 0;align-items:center;cursor:pointer}
.vnum{width:26px;height:26px;border-radius:50%;border:1.5px solid #CBD2E0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.vnum.cur{border-color:var(--bleu);color:var(--bleu)}.vnum.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.badge-v{display:inline-flex;gap:6px;align-items:center;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:700;white-space:nowrap}.badge-v i{width:7px;height:7px;border-radius:50%}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photo{width:76px;height:76px;border-radius:14px;background:#E7ECF7;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;position:relative}
.photo small{font-size:10px;color:var(--muted)}.photo.ajout{background:#fff;border:1.5px dashed #9ca3af;color:var(--bleu);cursor:pointer;font-family:inherit}
.qrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14px;gap:12px}
.sw{width:46px;height:26px;border-radius:13px;border:0;background:#CBD2E0;position:relative;cursor:pointer;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.badge-role{display:inline-flex;align-items:center;margin-left:6px;padding:0 7px;height:17px;border-radius:9px;background:#FBBF24;color:#78350F;font-size:10.5px;font-weight:800;letter-spacing:1px;vertical-align:1px}
.badge-role.dir{background:linear-gradient(135deg,#FDE68A,#F59E0B);color:#78350F}
.step{display:flex;align-items:center;gap:8px}.step button{width:32px;height:32px;border-radius:50%;border:1px solid #c7cad6;background:#fff;font-size:18px;line-height:1;cursor:pointer;color:var(--bleu)}.step b{min-width:26px;text-align:center}
.astuce{margin-top:8px;background:#FEF2F2;color:#991B1B;border-radius:10px;padding:8px 10px;font-size:12.5px;font-weight:600;cursor:pointer}
.case-liv{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:700;cursor:pointer}.case-liv input{width:20px;height:20px;accent-color:#1D4ED8}
.barre-rech{display:flex;gap:10px;align-items:center;margin-top:14px}.barre-rech .recherche{flex:1;margin:0}
.btn-filtre{position:relative;flex:none;width:48px;height:48px;border-radius:16px;border:0;background:#fff;color:var(--acc,#1F7AEA);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 16px var(--halo,rgba(0,0,0,.12))}
.btn-filtre i{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--acc,#1F7AEA);color:#fff;font-size:11px;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.titre-filtre{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.opt{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--ligne);font-size:15px;cursor:pointer}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid #c7cad6;position:relative;flex:none}.radio.on{border-color:var(--bleu)}.radio.on:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--bleu)}
.liv-lien{display:flex;justify-content:space-between;align-items:center;font-size:14.5px;font-weight:700;color:var(--acc,#1F7AEA);cursor:pointer;padding:2px 2px 14px;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.corps .ch{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:9px 2px;border-bottom:1px solid var(--ligne);font-size:14px}
.important{display:flex;flex-direction:column;gap:3px;background:#FEF3C7;color:#92400E;border-radius:14px;padding:11px 13px;margin-bottom:12px;font-size:12.5px}.important b{font-size:13.5px}
.consigne{display:flex;flex-direction:column;gap:3px;margin-top:10px;background:#EEF5FF;border-radius:12px;padding:10px 12px;font-size:13px}.consigne b{color:var(--bleu)}.consigne span{color:var(--muted)}.consigne .lien{align-self:flex-start;margin-top:2px;text-decoration:underline}
.nav{position:relative}
.plus-btn{flex:none!important;width:64px;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer}

/** Petite animation de comptage : un compteur [data-cnt] part de sa dernière valeur affichée et rejoint la nouvelle. */
const CNT_PREC = {};
function animerCompteurs() {
  document.querySelectorAll('[data-cnt]').forEach((el) => {
    const fin = Number(el.dataset.cnt), cle = el.dataset.cle, debut = cle in CNT_PREC ? CNT_PREC[cle] : fin;
    CNT_PREC[cle] = fin;
    if (debut === fin) return;
    const t0 = performance.now(), dur = 450;
    el.textContent = debut;
    const pas = (t) => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(debut + (fin - debut) * e); if (k < 1) requestAnimationFrame(pas); };
    requestAnimationFrame(pas);
  });
}

const SEUIL_VISITE = { 'A++': 7, 'A+': 10, A: 14, B: 21, C: 28, D: 35, E: 42, F: 56, G: 70 };
function joursDepuisVisite(mId) {
  const ages = [...S.visites.filter((v) => v.m === mId).map(() => 0), ...VISITES_AUTRES.filter((v) => v.m === mId).map((v) => v.age)];
  return ages.length ? Math.min(...ages) : null;
}
/** Jours écoulés depuis une date de la timeline (« 29 oct. », « 3 nov. »), au 4 nov. ; null si la date n'est pas passée ou illisible. */
function joursDepuisTl(d) {
  const j = parseInt(d, 10);
  if (!j) return null;
  const mois = d.includes('nov') ? 11 : d.includes('oct') ? 10 : d.includes('sept') ? 9 : 0;
  if (!mois) return null;
  const age = mois === 11 ? 4 - j : mois === 10 ? 4 + 31 - j : 4 + 31 + 30 - j;
  return age >= 0 ? age : null;
}

function visiteSaisie(d, k) {
  const titre = ETAPES_DPH.find((e) => e[0] === k)[1];
  const corps = k === 'dn'
    ? `<div class="np-section" style="color:var(--bleu);margin-top:0">DISTRIBUTION NUMÉRIQUE PAR KIT</div>
       <div class="selecteur" data-act="kits-ouvrir"><span>${d.kits.length ? d.kits.length + ' kit' + (d.kits.length > 1 ? 's' : '') + ' sélectionné' + (d.kits.length > 1 ? 's' : '') + ' · ajouter ou retirer…' : 'Sélectionner les kits du rayon…'}</span><span>▾</span></div>
       ${d.kits.map((c) => { const k = kitDe(c), v = d.dn[c] ?? 0; return `<div class="carte statique" style="margin-top:12px"><div class="ligne" style="align-items:center"><div style="flex:1;min-width:0;cursor:pointer" data-act="kit-detail" data-c="${c}"><h4>${esc(k.nom)} <span style="color:var(--bleu);font-weight:600">›</span></h4><p>${k.marque ? esc(k.marque) + ' · ' : ''}Réf. ${k.code}</p></div><b data-act="kit-retire" data-c="${c}" style="cursor:pointer;color:var(--muted);padding:4px">✕</b></div>
       </div>`; }).join('')}
       ${d.kits.length ? '' : '<div class="vide" style="margin-top:12px">Aucun kit sélectionné : choisissez les kits constatés en rayon, pour la distribution numérique.</div>'}`
    : k === 'bilan'
    ? (() => { const m = getM(d.m), o = objMag(m), pct = Math.round(o.ca / o.obj * 100), ligne = (a, b) => `<div class="ch"><span style="color:var(--muted)">${a}</span><b style="text-align:right">${b}</b></div>`;
      return `<div class="np-section" style="color:var(--bleu);margin-top:0">RÉSUMÉ DES RÉSULTATS</div>
       ${ligne('Distribution numérique', d.kits.length + ' kit' + (d.kits.length > 1 ? 's' : '') + ' vérifié' + (d.kits.length > 1 ? 's' : ''))}${ligne('Concurrence', d.conc.aucune || !d.conc.liste.length ? 'Aucune marque' : d.conc.liste.length + ' marque' + (d.conc.liste.length > 1 ? 's' : '') + ' · ' + String(d.conc.liste.reduce((a, c) => a + c.m, 0)).replace('.', ',') + ' m')}${ligne('Promotions', d.promos.ok === 'oui' ? 'Conformes' : 'Non conformes')}${ligne('Photos', PHOTO_CLES.reduce((a, c) => a + d.photos[c], 0))}${ligne('Visite PEM', d.pem.realisee ? 'Réalisée' : 'Non réalisée')}
       <div class="np-section" style="color:var(--bleu)">OBJECTIFS DU MAGASIN</div>
       ${ligne('CA / objectif du mois', o.ca.toLocaleString('fr-FR') + ' € / ' + o.obj.toLocaleString('fr-FR') + ' € (' + pct + ' %)')}${ligne('OP en cours', o.ops.filter((x) => x[3] === 'En cours').length)}
       <div class="qrow" style="margin-top:12px"><span>Je valide les objectifs et le bilan de cette visite</span><button class="sw ${d.bilan.ok ? 'on' : ''}" data-act="v-bilan"><i></i></button></div>
       <div class="champ"><label>Commentaire (facultatif)</label><textarea data-bind="bilan.note" placeholder="Ex. objectif atteint grâce à la PEM">${esc(d.bilan.note)}</textarea></div>`; })()
    : k === 'concurrence'
    ? `<div class="np-section" style="color:var(--bleu);margin-top:0">MARQUES ET MÉTRAGES CONCURRENTS</div>
       <div class="qrow"><span>Aucune marque concurrente en rayon</span><button class="sw ${d.conc.aucune ? 'on' : ''}" data-act="conc-aucune"><i></i></button></div>
       ${d.conc.aucune ? '' : `${d.conc.liste.map((c, i) => `<div class="carte statique" style="margin-top:12px"><div class="ligne" style="align-items:center"><div style="flex:1;min-width:0"><h4>${esc(c.marque)}</h4><p>${String(c.m).replace('.', ',')} m linéaire</p></div><b data-act="conc-retire" data-i="${i}" style="cursor:pointer;color:var(--muted);padding:4px">✕</b></div></div>`).join('')}
       <div class="carte statique" style="margin-top:12px"><div class="champ"><label>Marque concurrente</label><input id="conc-marque" placeholder="Ex. nom de la marque"></div><div class="champ"><label>Métrage (mètres linéaires)</label><input id="conc-m" inputmode="decimal" placeholder="Ex. 1,5"></div><button class="btn sm plein sales" data-act="conc-ajouter">＋ Ajouter cette marque</button></div>
       ${d.conc.liste.length ? '' : '<div class="vide" style="margin-top:12px">Aucune marque saisie : ajoutez les marques concurrentes et leur métrage, ou cochez « Aucune marque concurrente ».</div>'}`}`
    : `<div class="qrow"><span>Les promotions sont en place et conformes</span><button class="sw ${d.promos.ok === 'oui' ? 'on' : ''}" data-act="v-promo" data-v="${d.promos.ok === 'oui' ? 'non' : 'oui'}"><i></i></button></div>
       <div class="champ"><label>Remarque (facultatif)</label><textarea data-bind="promos.note" placeholder="Ex. tête de gondole non refaite">${esc(d.promos.note)}</textarea></div>`;
  return {
    page: `<div class="topbar" style="background:#fff;border-bottom:1px solid var(--ligne)"><button class="retour sombre" data-act="retour">←</button><div style="flex:1;min-width:0"><b style="font-size:16px">${titre}</b><small>${esc(getM(d.m).nom)}</small></div></div><div class="corps">${corps}</div>`,
    bas: `<div class="bas" style="background:#fff"><button class="btn plein sales" data-act="v-etape-ok" data-k="${k}">✓ Enregistrer ${k === 'dn' ? 'la vérification DN' : k === 'concurrence' ? 'la concurrence' : k === 'bilan' ? 'le bilan de visite' : 'la vérification Promos'}</button></div>`,
  };
}

      <div class="corps"><div class="np-section" style="color:var(--bleu);margin-top:0">COMPTE RENDU DE LA VISITE</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px"><span class="pastille p-vert">Visite DPH</span><span class="pastille ${d.pem.realisee ? 'p-vert' : 'p-gris'}">Visite PEM${d.pem.realisee ? '' : ' · non réalisée'}</span></div>

      <div class="np-section" style="color:var(--bleu)">LA VISITE</div>

      <div class="np-section" style="color:var(--bleu)">COMMANDE LIÉE À LA VISITE DPH</div>
      ${d.cmd ? lig('Commande', `#${d.cmd.id} : ${d.cmd.ht} - ${d.cmd.liv}`) : '<div class="ch"><span style="color:var(--muted)">Aucune commande liée</span></div>'}
      ${d.pem.realisee ? '' : `<div class="np-section" style="color:var(--bleu)">VISITE PEM</div>${lig('Pas de visite PEM car', esc(d.pem.raison))}`}

      <div class="np-section" style="color:var(--bleu)">CONCURRENCE</div>${d.conc.aucune || !d.conc.liste.length ? '<div class="ch"><span style="color:var(--muted)">Aucune marque concurrente en rayon</span></div>' : d.conc.liste.map((c) => lig(esc(c.marque), String(c.m).replace('.', ',') + ' m')).join('')}
      <div class="np-section" style="color:var(--bleu)">TIMING DE VISITE</div>
      ${ETAPES_DPH.map(([k, l]) => `<div class="ecart"><span class="ecart-ic" style="background:#DDF5E6;color:#166534">✓</span><div style="flex:1"><b>${l}</b><small>${d.chrono[k]}</small></div></div>`).join('')}
      ${d.etat === 'brouillon' ? '' : `<div class="pied" style="margin-top:10px">${d.propre === false || d.par !== ROLES[ROLE].nom ? 'Lecture seule : cette visite n\'est pas la vôtre.' : 'Visite validée : elle n\'est plus modifiable.'}</div>`}</div>`,
  };
}

function modaleSales() {

  if (m.type === 'km') {
    const dep = m.phase === 'depart', ref = dep ? 48215 : (S.km.depart || 48215);
    return `<div class="voile" data-act="km-plus-tard"><div class="dialogue" data-stop="1"><div style="font-size:30px;margin-bottom:4px">🚗</div><h3>${dep ? 'Kilométrage de départ' : 'Kilométrage d\'arrivée'}</h3>
      <p>${dep ? 'Relevez le compteur de votre véhicule avant de commencer votre tournée.' : 'Votre tournée est terminée : relevez le compteur de votre véhicule.'} <b>Facultatif</b> : vous pouvez le faire plus tard.</p>
      <div class="champ"><label>Kilométrage (km)</label><input id="km-val" inputmode="numeric" placeholder="Dernier relevé : ${ref.toLocaleString('fr-FR').replace(/\u202f/g, ' ')} km"></div>
      <div class="rangee"><button class="btn sm" data-act="km-plus-tard">Plus tard</button><button class="btn sm plein sales" data-act="km-ok" data-p="${m.phase}">Enregistrer</button></div></div></div>`;

      <div style="font-size:13px;color:var(--muted);margin-bottom:8px">Réf. ${k.code} · ${l.length} produit${l.length > 1 ? 's' : ''} dans le kit</div>
      ${l.length ? l.map(([code, qte]) => { const p = PRODUITS.find((x) => x.code === code); return p ? `<div class="ecart"><span class="ecart-ic" style="background:#DFE8FF;color:#1E3A8A;width:34px;border-radius:10px">×${qte}</span><div style="flex:1;min-width:0"><b>${esc(p.nom)}</b><small>${esc(p.marque)} · Réf. ${p.code} · EAN ${p.ean}</small></div></div>` : ''; }).join('') : '<div class="vide">Composition non renseignée.</div>'}
      <div class="rangee" style="margin-top:14px"><button class="btn sm plein sales" data-act="fermer">Fermer</button></div></div></div>`;
  }
  if (m.type === 'kits') {
    const d = getV(m.id);
    return `<div class="voile" data-act="fermer"><div class="feuille" data-stop="1"><div class="poignee"></div><h3>Kits du rayon</h3>
      <div style="font-size:13px;color:var(--muted);margin-bottom:6px">Cochez les kits constatés en rayon pour la distribution numérique.</div>
      ${KITS.map((k) => `<div class="opt" data-act="kit-toggle" data-c="${k.code}"><span><b style="font-size:14.5px">${esc(k.nom)}</b><br><span style="color:var(--muted);font-size:12.5px">${k.marque ? esc(k.marque) + ' · ' : ''}Réf. ${k.code}</span></span><i class="case ${d.kits.includes(k.code) ? 'on' : ''}">${d.kits.includes(k.code) ? '✓' : ''}</i></div>`).join('')}
      <div class="rangee" style="margin-top:14px"><button class="btn sm" data-act="kit-vider">Tout décocher</button><button class="btn sm plein sales" data-act="fermer">Valider (${d.kits.length})</button></div></div></div>`;
  }
  if (m.type === 'cmd-pas') {
    const d = S.cmd, motifs = ['Impératif', 'Inventaire'];
    return `<div class="voile" data-act="pas-annuler"><div class="feuille" data-stop="1"><div class="poignee"></div>
      <div class="important"><b>⚠ Important</b><span>Cette consigne est transmise à l'ADV : indiquez pourquoi et à partir de quand le client peut être livré.</span></div>
      <h3>Ne pas livrer avant…</h3>
      <div class="titre-filtre">Motif</div>${motifs.map((x) => `<div class="opt" data-act="pas-motif" data-v="${x}"><span>${x}</span><i class="radio ${d.motifPas === x ? 'on' : ''}"></i></div>`).join('')}
      
      <div class="champ" style="margin-top:12px"><label>Ne pas livrer avant le *</label><input type="date" min="2026-11-04" value="${d.dateMin || ''}" data-cmd="dateMin"></div>
      <div class="rangee" style="margin-top:6px"><button class="btn sm" data-act="pas-annuler">Annuler</button><button class="btn sm plein sales" data-act="pas-ok">Valider</button></div></div></div>`;
  }
  if (m.type === 'mfiltres') {
    const f = S.mf, nb = magasinsListe().length;
    const opt = (act, attr, lib, on) => `<div class="opt" data-act="${act}" ${attr}><span>${lib}</span><i class="radio ${on ? 'on' : ''}"></i></div>`;
    return `<div class="voile" data-act="fermer"><div class="feuille" data-stop="1"><div class="poignee"></div><h3>Filtres</h3>
      ${ROLE !== 'cs' ? `<div class="titre-filtre">Afficher</div>${opt('mag-portee', 'data-v="mes"', (ROLE === 'dir' ? 'Tous les clients' : 'Mon portefeuille') + ' <span style="color:var(--muted);font-size:12.5px">(' + nbMesClients() + ')</span>', f.portee === 'mes')}${opt('mag-portee', 'data-v="tous"', (ROLE === 'dir' ? 'Clients de ma région' : 'Tous les clients du secteur') + ' <span style="color:var(--muted);font-size:12.5px">(' + S.tousMag.length + ')</span>', f.portee === 'tous')}` : ''}
      <div class="titre-filtre">Enseigne</div><div class="champ" style="margin-bottom:6px"><select data-input="magEns"><option value="toutes">Toutes les enseignes</option>${[...new Set(baseMagasins().map((x) => enseigneDe(x.nom)))].sort((a, b) => a.localeCompare(b)).map((e) => `<option value="${esc(e)}" ${f.ens === e ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select></div>
      <div class="titre-filtre">Trier par</div>${opt('mag-tri', 'data-v="nom"', 'Nom (A → Z)', f.tri === 'nom')}${opt('mag-tri', 'data-v="classe"', 'Classification (A → G)', f.tri === 'classe')}
      <div class="rangee" style="margin-top:14px"><button class="btn sm" data-act="mag-reset">Réinitialiser</button><button class="btn sm plein sales" data-act="fermer">Voir ${nb} client${nb > 1 ? 's' : ''}</button></div></div></div>`;
  }
  if (m.type === 'cfiltres') {

      <div class="titre-filtre">Type de commande</div>${[['tous', 'Toutes les commandes'], ['edi', 'Commandes EDI'], ['appli', 'Commandes saisies dans l\'appli']].map((x) => opt('cf-type', `data-v="${x[0]}"`, x[1], f.type === x[0])).join('')}
      <div class="titre-filtre">État</div>${[['tous', 'Tous les états'], ['PAS_LIVREE', 'Pas livrée'], ['LIVREE', 'Livrée']].map((x) => opt('cf-etat', `data-v="${x[0]}"`, x[1], f.etat === x[0])).join('')}
      <div class="titre-filtre">Période</div>${[['toutes', 'Toutes les dates'], ['jour', 'Aujourd\'hui'], ['semaine', '7 derniers jours']].map((x) => opt('cf-periode', `data-v="${x[0]}"`, x[1], f.periode === x[0])).join('')}
      <div class="rangee" style="margin-top:14px"><button class="btn sm" data-act="cf-reset" data-d="${defaut}">Réinitialiser</button><button class="btn sm plein sales" data-act="fermer">Voir ${nb} commande${nb > 1 ? 's' : ''}</button></div></div></div>`;
  }
  if (m.type === 'vfiltres') {
    const f = S.vf, nb = visitesListe().length;
    const opt = (act, attr, lib, on) => `<div class="opt" data-act="${act}" ${attr}><span>${lib}</span><i class="radio ${on ? 'on' : ''}"></i></div>`;
    return `<div class="voile" data-act="fermer"><div class="feuille" data-stop="1"><div class="poignee"></div><h3>Filtres</h3>
      <div class="titre-filtre">Afficher</div>${opt('vf-portee', 'data-v="mes"', 'Mes visites', f.portee === 'mes')}${opt('vf-portee', 'data-v="toutes"', 'Toutes les visites <span style="color:var(--muted);font-size:12.5px">(' + PORTEE_TXT[ROLE] + ')</span>', f.portee === 'toutes')}
      <div class="titre-filtre">État</div>${[['tous', 'Tous les états'], ['brouillon', 'Brouillon'], ['terminee', 'À envoyer'], ['envoyee', 'Envoyée']].map((x) => opt('vf-etat', `data-v="${x[0]}"`, x[1], f.etat === x[0])).join('')}
      <div class="titre-filtre">Période</div>${[['toutes', 'Toutes les dates'], ['jour', 'Aujourd\'hui'], ['semaine', '7 derniers jours']].map((x) => opt('vf-periode', `data-v="${x[0]}"`, x[1], f.periode === x[0])).join('')}
      <div class="rangee" style="margin-top:14px"><button class="btn sm" data-act="vf-reset">Réinitialiser</button><button class="btn sm plein sales" data-act="fermer">Voir ${nb} visite${nb > 1 ? 's' : ''}</button></div></div></div>`;

  if (m.type === 'svalider') {
    const manq = manquants(getV(m.id)), ok = !manq.length;
    return `<div class="voile" data-act="fermer"><div class="dialogue" data-stop="1"><h3>${ok ? 'Valider la visite ?' : 'Visite incomplète'}</h3>${ok ? '<p>La visite DPH est complète (7 étapes horodatées). Une fois validée, elle part dès que le réseau le permet et n\'est plus modifiable.</p>' : `<p>Il reste à faire :</p>${manq.map((b) => `<div class="erreur" style="padding:8px 10px;margin-bottom:6px">${esc(b)}</div>`).join('')}`}<div class="rangee"><button class="btn sm" data-act="fermer">${ok ? 'Continuer' : 'Corriger'}</button>${ok ? '<button class="btn sm plein sales" data-act="v-valider-ok">Valider</button>' : ''}</div></div></div>`;

  if (m.type === 'sfiltres') {

/** Produits de remplacement : même catégorie, disponibles ; la même famille d'abord, puis le prix le plus proche. */
function remplacements(p) {
  return PRODUITS.filter((x) => x.id !== p.id && x.cat === p.cat && x.stock !== 'Rupture')
    .sort((a, b) => (b.famille === p.famille) - (a.famille === p.famille) || Math.abs(a.prix - p.prix) - Math.abs(b.prix - p.prix)).slice(0, 3);
}
const motifFinal = (o) => (o.motifPas === 'Autre' ? (o.motifAutre || '').trim() || 'Autre' : o.motifPas);
const dateFr = (iso) => `${Number(iso.slice(8, 10))} ${MOIS[Number(iso.slice(5, 7)) - 1]}`;
function startCommande(mId, visiteId) { S.cmd = { m: mId || null, l: [], cat: null, q: '', note: '', pas: false, dateMin: '', motifPas: '', motifAutre: '', fromAttente: null, depuisVisite: visiteId || null }; S.pile.push({ type: 'cmd' }); render(); }

function cmdEcran() {
  const d = S.cmd;
  if (!d.m) {
    return { page: `<div class="topbar" style="background:#fff;border-bottom:1px solid var(--ligne)"><button class="retour sombre" data-act="retour">←</button><div><b>Nouvelle commande</b><small>Étape 1 sur 2 · choisissez le client</small></div></div>
      <div class="corps">${S.magasins.filter((m) => m.actif !== false).map((m) => `<div class="carte" data-act="cmd-magasin" data-id="${m.id}"><div class="ligne" style="align-items:center"><div style="flex:1"><h4>${esc(m.nom)}</h4><p>${esc(m.adresse)}</p></div><span style="color:var(--muted)">›</span></div></div>`).join('')}</div>` };
  }
  const q = d.q.toLowerCase();
  const liste = PRODUITS.filter((p) => (!q || (p.nom + p.marque + p.code).toLowerCase().includes(q)) && (!d.cat || p.cat === d.cat) && !(d.masquer && p.stock === 'Rupture'));
  const row = (p) => {
    const info = stockInfo(p), l = ligneCmd(p.id), rupture = p.stock === 'Rupture', trop = l && l.qty > p.qte;
    const action = rupture ? `<button class="btn sm" style="width:auto;padding:0 12px;border-color:var(--alert);color:var(--alert)" data-act="cmd-remp" data-id="${p.id}">Remplacer ›</button>`
      : l ? `<div class="step"><button data-act="cmd-moins" data-id="${p.id}">−</button><b>${l.qty}</b><button data-act="cmd-plus" data-id="${p.id}">＋</button></div>`
      : `<button class="btn sm plein sales" style="width:auto;padding:0 14px" data-act="cmd-plus" data-id="${p.id}">＋ Ajouter</button>`;
    return `<div class="carte statique"><div class="ligne" style="align-items:center"><div style="flex:1;min-width:0"><h4 style="font-size:14.5px">${esc(p.nom)}</h4><p>${esc(p.marque)} · Réf. ${p.code} · ${euros(p.prix)} HT</p>
      <div style="margin-top:6px;font-size:12.5px;font-weight:700;color:${info.col}">● ${info.txt}</div></div><div style="flex:none">${action}</div></div>
      ${rupture ? `<div class="astuce" style="cursor:default">Le produit sera disponible à partir du ${p.reappro}</div>` : ''}
      ${trop ? `<div class="erreur" style="margin:8px 0 0;padding:8px 10px;font-size:12.5px">Stock insuffisant : ${p.qte} disponibles pour ${l.qty} demandés. <b data-act="cmd-remp" data-id="${p.id}" style="text-decoration:underline;cursor:pointer">Compléter avec un remplacement ›</b></div>` : ''}</div>`;
  };
  return {
    page: `<div class="topbar" style="background:#fff;border-bottom:1px solid var(--ligne)"><button class="retour sombre" data-act="retour">←</button><div style="flex:1;min-width:0"><b>Nouvelle commande</b><small>${esc(getM(d.m).nom)}</small></div></div>
      <div class="corps"><div class="barre-rech" style="margin-bottom:12px"><input class="recherche" style="margin:0" placeholder="Nom, marque ou référence" value="${esc(d.q)}" data-input="cmdQ"><button class="btn-filtre" data-act="cmd-filtres" aria-label="Filtres">${ICONES.filtre}${(d.cat ? 1 : 0) + (d.masquer ? 1 : 0) ? `<i>${(d.cat ? 1 : 0) + (d.masquer ? 1 : 0)}</i>` : ''}</button></div>
      ${liste.map(row).join('') || '<div class="vide">Aucun produit.</div>'}</div>`,
    bas: `<div class="bas" style="background:#fff;align-items:center"><div style="flex:1"><b>${nbArticles()} article${nbArticles() > 1 ? 's' : ''}</b><div style="font-size:12px;color:var(--muted)">${eurD(totalCmd())} HT</div></div><button class="btn plein sales" style="flex:none;width:auto;padding:0 20px" data-act="cmd-panier">Voir le panier ›</button></div>`,
  };
}

function cmdPanier() {
  const d = S.cmd, m = getM(d.m), total = totalCmd();
  const lignes = d.l.map((l) => {
    const p = prodDe(l.id), info = stockInfo(p), trop = l.qty > p.qte;
    return `<div class="carte statique"><div class="ligne" style="align-items:center"><div style="flex:1;min-width:0"><h4 style="font-size:14.5px">${esc(p.nom)}</h4><p>${euros(p.prix)} × ${l.qty} = <b style="color:var(--texte)">${eurD(p.prix * l.qty)}</b></p>
      <div style="margin-top:4px;font-size:12px;font-weight:700;color:${info.col}">● ${info.txt}</div>${l.remplace ? `<div style="margin-top:4px"><span class="pastille p-bleu">↺ Remplace ${esc(prodDe(l.remplace).nom)}</span></div>` : ''}</div>
      <div class="step"><button data-act="cmd-moins" data-id="${p.id}">−</button><b>${l.qty}</b><button data-act="cmd-plus" data-id="${p.id}">＋</button></div></div>
      ${trop ? `<div class="erreur" style="margin:8px 0 0;padding:8px 10px;font-size:12.5px">Stock insuffisant (${p.qte} disponibles). <b data-act="cmd-remp" data-id="${p.id}" style="text-decoration:underline;cursor:pointer">Remplacement ›</b></div>` : ''}</div>`;
  }).join('');
  return {
    page: `<div class="topbar" style="background:#fff;border-bottom:1px solid var(--ligne)"><button class="retour sombre" data-act="retour">←</button><div style="flex:1"><b>Panier</b><small>${esc(m.nom)}</small></div><button class="btn sm plein sales" style="flex:none;width:auto;padding:0 14px;height:40px" data-act="retour">＋ Ajouter des articles</button></div>
      <div class="corps">${lignes || '<div class="vide">Le panier est vide.</div>'}
      <div class="carte statique"><div class="ligne"><span style="flex:1;color:var(--muted)">${d.l.length} référence${d.l.length > 1 ? 's' : ''} · ${nbArticles()} articles</span></div><div class="ligne" style="margin-top:6px"><b style="flex:1;font-size:15px">Total HT</b><b style="font-size:17px">${eurD(total)}</b></div>
      <div style="font-size:12px;color:var(--muted);margin-top:6px">🚚 Livraison estimée ${d.pas && d.dateMin ? 'à partir du ' + dateFr(d.dateMin) : 'ven. 6 nov.'}</div></div>
      <div class="carte statique"><label class="case-liv"><input type="checkbox" data-act="cmd-pasavant" ${d.pas ? 'checked' : ''}> Ne pas livrer avant une date précise</label>${d.pas && d.dateMin ? `<div class="consigne"><b>⏳ Ne pas livrer avant le ${dateFr(d.dateMin)}</b><span>Motif : ${esc(motifFinal(d))}</span><button class="lien" data-act="pas-modifier">Modifier</button></div>` : ''}</div>
      <div class="champ"><label>Remarque pour l'ADV (facultatif)</label><textarea data-cmd="note" placeholder="Ex. prévenir le chef de rayon">${esc(d.note || '')}</textarea></div></div>`,
    bas: `<div class="bas" style="background:#fff"><button class="btn tonal${S.focus === 'attente' ? ' pulse' : ''}" data-act="cmd-attente">⏸ Mettre en attente</button><button class="btn plein sales" data-act="cmd-valider">✓ Valider</button></div>`,
  };
}

function modaleRemplacement(m) {
  const p = prodDe(m.id), l = ligneCmd(p.id), reste = l ? Math.max(0, l.qty - Math.max(0, p.qte)) : 0, besoin = reste || p.pcb;
  const rem = remplacements(p), info = stockInfo(p);
  return `<div class="voile" data-act="fermer"><div class="feuille" data-stop="1"><div class="poignee"></div><h3>Produits de remplacement</h3>
    <div class="erreur"><b>${esc(p.nom)}</b><br>${p.stock === 'Rupture' ? info.txt : `Stock insuffisant : ${p.qte} disponibles, ${l ? l.qty : ''} demandés`}</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:6px">Proposés de la même marque, en stock (même famille en premier). Quantité reprise : <b>${besoin}</b>.</div>
    ${rem.length ? rem.map((r) => { const ri = stockInfo(r); return `<div class="carte statique" style="margin-bottom:8px"><div class="ligne" style="align-items:center"><div style="flex:1;min-width:0"><h4 style="font-size:14px">${esc(r.nom)}</h4><p>${esc(r.marque)} · ${esc(r.famille)}${r.famille === p.famille ? ' · <b style="color:var(--bleu)">même famille</b>' : ''}</p><div style="font-size:12px;font-weight:700;color:${ri.col};margin-top:4px">● ${ri.txt} · ${euros(r.prix)} HT</div></div><button class="btn sm plein sales" style="width:auto;padding:0 12px" data-act="cmd-choisir" data-orig="${p.id}" data-id="${r.id}">Choisir</button></div></div>`; }).join('') : '<div class="vide">Aucun produit de remplacement disponible.</div>'}</div></div>`;
}

Object.assign(SA, {
  'cmd-nouvelle'() { startCommande(null); },
  'cmd-magasin'(d) { S.cmd.m = d.id; render(); },
  'mag-filtres'() { S.modale = { type: 'mfiltres' }; render(); },
  'mag-portee'(d) { S.mf.portee = d.v; render(); },
  'mag-tri'(d) { S.mf.tri = d.v; render(); },
  'mag-reset'() { S.mf = { ...S.mf, portee: defautPortee(), tri: 'nom', ens: 'toutes' }; render(); },
  'com-filtres'() { S.modale = { type: 'cfiltres' }; render(); },
  'cf-portee'(d) { S.cf.portee = d.v; render(); },
  'cf-etat'(d) { S.cf.etat = d.v; render(); },
  'cf-type'(d) { S.cf.type = d.v; render(); },
  'cf-periode'(d) { S.cf.periode = d.v; render(); },
  'cf-reset'(d) { S.cf = { ...S.cf, portee: d.d, etat: 'tous', periode: 'toutes', type: 'tous' }; render(); },
  'liv-toggle'() { S.livOuvert = !S.livOuvert; render(); },
  'vis-filtres'() { S.modale = { type: 'vfiltres' }; render(); },
  'vf-portee'(d) { S.vf.portee = d.v; render(); },
  'vf-etat'(d) { S.vf.etat = d.v; render(); },
  'vf-periode'(d) { S.vf.periode = d.v; render(); },
  'vf-reset'() { S.vf = { ...S.vf, portee: 'mes', etat: 'tous', periode: 'toutes' }; render(); },
  'visite-ro'(d) { S.pile.push({ type: 'cr', id: d.id }); render(); },
  'cmd-cat'(d) { S.cmd.cat = d.c || null; render(); },
  'cmd-filtres'() { S.modale = { type: 'cmd-filtres' }; render(); },
  'cmd-masquer'() { S.cmd.masquer = !S.cmd.masquer; render(); },
  'cmd-reset'() { S.cmd.cat = null; S.cmd.masquer = false; render(); },
  'cmd-plus'(d) { const p = prodDe(d.id), l = ligneCmd(d.id); if (l) l.qty += 1; else S.cmd.l.push({ id: p.id, qty: p.pcb, remplace: null }); render(); },
  'cmd-moins'(d) { const l = ligneCmd(d.id); if (!l) return; l.qty -= 1; if (l.qty <= 0) S.cmd.l = S.cmd.l.filter((x) => x !== l); render(); },
  'cmd-panier'() { S.pile.push({ type: 'cmd-panier' }); render(); },
  'cmd-remp'(d) { S.modale = { type: 'cmd-remp', id: d.id }; render(); },
  'cmd-choisir'(d) {
    const p = prodDe(d.orig), l = ligneCmd(p.id), reste = l ? Math.max(0, l.qty - Math.max(0, p.qte)) : 0, besoin = reste || p.pcb;
    if (l && reste) l.qty = Math.max(0, p.qte); // on garde ce qui est disponible, le reste passe au remplacement
    S.cmd.l = S.cmd.l.filter((x) => x.qty > 0);
    const ex = ligneCmd(d.id); if (ex) { ex.qty += besoin; ex.remplace = ex.remplace || p.id; } else S.cmd.l.push({ id: d.id, qty: besoin, remplace: p.id });
    S.modale = null; toast(`${prodDe(d.id).nom} ajouté en remplacement.`);
  },
  'cmd-valider'() {
    const d = S.cmd;
    if (!d.l.length) return toast('Le panier est vide : ajoutez au moins un produit.');
    const bloque = d.l.find((l) => l.qty > prodDe(l.id).qte);
    if (bloque) return toast(`Stock insuffisant pour « ${prodDe(bloque.id).nom} » : choisissez un remplacement ou baissez la quantité.`);
    if (d.pas && (!d.dateMin || !d.motifPas || (d.motifPas === 'Autre' && !d.motifAutre.trim()))) { S.modale = { type: 'cmd-pas' }; return toast('Précisez le motif et la date de la consigne « ne pas livrer avant ».'); }
    const num = 'CDE-' + (2042 + COMMANDES.length - 8);
    COMMANDES.unshift({ src: 'Appli', par: ROLES[ROLE].nom, id: num, m: d.m, date: '4 nov.', ht: eurD(totalCmd()), lignes: d.l.length, st: 'PAS_LIVREE', transp: null, suivi: null, eta: d.pas ? 'à partir du ' + dateFr(d.dateMin) : 'ven. 6 nov.', pasAvant: d.pas ? d.dateMin : null, motifPas: d.pas ? motifFinal(d) : null, note: d.note, colis: Math.max(1, Math.ceil(nbArticles() / 12)), evts: [['Commande reçue', '4 nov. 14:23']] });
    if (d.fromAttente != null) S.attente.splice(d.fromAttente, 1);
    const vv = d.depuisVisite && getV(d.depuisVisite);
    if (vv) vv.cmd = { id: num.replace('CDE-', ''), ht: eurD(totalCmd()), liv: '06/11/2026' };
    S.cmd = null; S.pile = vv ? [{ type: 'visite', id: vv.id }] : []; if (!vv) S.sOnglet = 2; S.sLiv = 'toutes'; toast(`Commande ${num} enregistrée${d.pas ? ' · livraison à partir du ' + dateFr(d.dateMin) : ''}. Envoi dès que le réseau le permet.`);
  },
  'bientot-cmd-visite'() { const v = getV(S.pile.at(-1).id); startCommande(v.m, v.id); },
});

/** « Nouveau prospect » : identité et qualification, comme dans l'appli. Le prospect part dans la file d'envoi. */

      <div class="rangee">${liste('classe', 'Classe du client', [['', '— non renseignée —'], ...['A', 'B', 'C', 'D', 'E', 'F', 'G'].map((c) => [c, 'Classe ' + c])])}${liste('etape', 'Étape', [['NOUVEAU', 'Nouveau'], ['CONTACTE', 'Contacté'], ['VISITE', 'Visite'], ['PROPOSITION', 'Proposition'], ['NEGOCIATION', 'Négociation'], ['GAGNE', 'Gagné']])}</div>

function ecranPile(h) {
  if (h.type === 'nouveau-prospect') return nouveauProspect();
  if (h.type === 'cs-sem') return pageSemaineCS(EQUIPE_CS.find((x) => x.id === h.id), h.n);
  if (h.type === 'promo-page') return pagePromo(h.cs, h.nom);
  if (h.type === 'equipe-cs') return pageCS(EQUIPE_CS.find((x) => x.id === h.id));
  if (h.type === 'cmd') return cmdEcran();
  if (h.type === 'cmd-panier') return cmdPanier();
  if (h.type === 'visite') { const v = getV(h.id); return v.etat === 'brouillon' ? visiteEtapes(v) : compteRendu(v); }
  if (h.type === 'saisie') return visiteSaisie(getV(h.id), h.k);
  if (h.type === 'cr') return compteRendu(S.visites.find((v) => v.id === h.id) || VISITES_AUTRES.find((v) => v.id === h.id));
  if (h.type === 'prospect') return fichePros(getP(h.id));
  if (h.type === 'magasin') return ficheMag(getM(h.id));
  return { page: '' };
}

/** Magasins de la même enseigne renvoyés par l'API : client, prospect, ou « À prospecter » (ni client ni prospect). Liste d'exemple. */
const VILLES_A_PROSPECTER = [['Le Havre', '76600'], ['Dieppe', '76200'], ['Pont-Audemer', '27500'], ['Saint-Lô', '50000'], ['Bayeux', '14400'], ['Fécamp', '76400']];
function magasinsProspect(p) {
  const enseigne = p.nom.split(' – ')[0].replace(/ HM$/, '').toLowerCase();
  const meme = (nom) => nom.toLowerCase().startsWith(enseigne);
  const prospects = S.prospects.filter((x) => x.id !== p.id && meme(x.nom)).map((x) => ({ nom: x.nom, ville: x.cp, st: 'Prospect', detail: groupe(x.statut), pid: x.id })).slice(0, 2);
  const clients = tousLesClients().filter((m) => meme(m.nom)).slice(0, 2).map((m) => ({ nom: m.nom, ville: m.adresse || '', st: 'Client', detail: 'Classe ' + m.classe, mid: m.id }));
  const nb = Math.max(3, 8 - prospects.length - clients.length);
  const autres = Array.from({ length: nb }, (_, i) => ({ nom: p.nom.split(' – ')[0] + ' – ' + VILLES_A_PROSPECTER[(i + p.id.length) % VILLES_A_PROSPECTER.length][0], ville: VILLES_A_PROSPECTER[(i + p.id.length) % VILLES_A_PROSPECTER.length][1], st: 'À prospecter', detail: '' }));
  return [...clients, ...prospects, ...autres];
}
function ongletMagasinsProspect(p) {
  const l = magasinsProspect(p), c = (st) => l.filter((x) => x.st === st).length;
  const pastille = (x) => x.st === 'Client' ? '<span class="pastille p-vert">Client</span>' : x.st === 'Prospect' ? `<span class="pastille p-violet">${esc(x.detail)}</span>` : '<span class="pastille p-bleu">À prospecter</span>';

/** Clients d'un promoteur (ceux de ses visites), pour le planning que son encadrement lui compose. */
function clientsDe(nom) {
  const p = Object.values(PROMOS).flat().find((x) => x.nom === nom) || { nom, v: 6, mag: 3, jour: [] };
  const noms = new Set(activitePromo(p).visites.map((v) => v.client));
  const l = S.magasins.filter((m) => noms.has(m.nom));
  return l.length >= 2 ? l : S.magasins;
}
