server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Pas de mot de passe : l'accès se limite par le réseau (VPN / réseau interne).
  # Exemple à adapter avec les plages internes d'ABC, puis décommenter :
  # allow 10.0.0.0/8;
  # allow 192.168.0.0/16;
  # deny all;

  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  location / {
    try_files $uri /index.html;
  }
}
