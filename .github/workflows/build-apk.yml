name: APK crm-app

# Construit l'APK release de l'appli mobile sur un runner GitHub (pas sur le serveur de staging) et le publie comme
# artefact du run. Déclenché à la main (adresse d'API facultative) ou en poussant un tag `apk-*` : pas de build à chaque
# push, pour ménager les minutes et le stockage de GitHub. Un seul artefact (`crm-app-staging`), remplacé à chaque build.
# L'APK est signé avec la clé de debug tant qu'aucun keystore de release n'est configuré (voir android/app/build.gradle.kts).
on:
  push:
    tags: ['apk-*']
  workflow_dispatch:
    inputs:
      api_url:
        description: "Adresse de l'API (vide = valeur par défaut de l'appli : https://api-staging.abcosmetique.com)"
        required: false
        default: ''

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crm-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse
        run: flutter analyze

      - name: Construire l'APK release
        env:
          API_URL: ${{ github.event.inputs.api_url }}
        run: |
          if [ -n "$API_URL" ]; then
            flutter build apk --release --dart-define=API_URL="$API_URL"
          else
            flutter build apk --release
          fi

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: crm-app-staging
          path: crm-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          overwrite: true
          if-no-files-found: error
